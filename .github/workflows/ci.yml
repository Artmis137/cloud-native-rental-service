name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t car-rental-api .

      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 car-rental-api
          for i in $(seq 1 10); do curl -sf http://localhost:8000/cars && exit 0; sleep 1; done
          docker logs api
          exit 1
